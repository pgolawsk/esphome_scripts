---
#* UART interface for a RECEIVE-ONLY RS485 sniffer (TTL to RS485 module, e.g. HW-519)
#! NEVER add tx_pin here: the ESP must not transmit on the bus. Tie the module RXD (DI) to 3.3V, not to an ESP pin.
#? Frames are split by line silence (${frame_gap}) and logged as hex at INFO under the "rs485" tag.
# FLUX, 20261108, created for the Haba RS485 sniffer (step 1: raw frame log, no decoding)

uart:
  - id: ${uart_id}
    rx_pin: ${rx_pin}
    baud_rate: ${baud_rate}
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: ${frame_gap}
      sequence:
        - lambda: |-
            ESP_LOGI("rs485", "RX %u B: %s", (unsigned) bytes.size(), format_hex_pretty(bytes).c_str());
