---
#* Enable MQTT
# Pawelo, 20221119, created as my framework based on !include statements
# Pawelo, 20230115, added more options based on https://github.com/esphome/issues/issues/3406
# Pawelo, 20230129, added RTTTL topic to play
# Pawelo, 20230130, moved on_message topics to separate include files
#! Pawelo, 20230410, prometheus randomly not working while client_id is set
# Pawelo, 20250126, set discovery to false to avoid duplicated entries on HA
# Pawelo, 20251218, added keepalive to 60s to avoid disconnections on some brokers
# FLUX, 20261121, Added on_connect: delay 3s + uptime marker + logger.replay_boot_logs (boot log buffer to Loki, ESPHome 2026.11.0)

mqtt:
  id: mqtt_client
  broker: !secret mqtt_ip
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_password
  keepalive: 60s
  reboot_timeout: 0s
  on_connect:
    # Replay the logger boot buffer so pre-WiFi boot lines reach Loki. The delay is required: the MQTT log
    # callback publishes only when is_connected(), which is not yet true inside on_connect. The marker line
    # carries device uptime, so the log pipeline can put replayed (@<ms>ms) lines on the real timeline.
    - delay: 3s
    - lambda: ESP_LOGI("boot_replay", "uptime_ms=%u", (unsigned) millis());
    - logger.replay_boot_logs:
  # skip_cert_cn_check: true
  # client_id: $devicename
  discovery: false
  # discovery_retain: false
  #discovery_unique_id_generator: mac
  #discovery_object_id_generator: device_name
